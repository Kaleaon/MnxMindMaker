name: Check Drive map editor
on:
  push:
    paths: ['tools/map-editor/**', 'docs/*.html', 'docs/*.js', 'docs/style.css', '.github/workflows/map-editor-pages.yml']
  pull_request:
    paths: ['tools/map-editor/**', 'docs/*.html', 'docs/*.js', 'docs/style.css', '.github/workflows/map-editor-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check && npm run check-docs
        working-directory: tools/map-editor
